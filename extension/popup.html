<!doctype html><html lang="ko"><meta charset="utf-8"><title>M-에듀파인 연결</title>
<link rel="stylesheet" href="popup.css"><body>
<h1>M-에듀파인</h1><p>실제 업무 탭 ↔ Windows 키보드 화면</p>
<p id="host">현재 탭을 확인하는 중입니다.</p>
<button id="connect">이 탭 연결</button><button id="disconnect">연결 해제</button>
<p id="status" role="status">최초 한 번 Windows 설치파일을 설치하세요.</p>
<small>비공식 · 현장검증용<br>인증서는 원본 브라우저에서만 입력합니다.<br>연결은 이 탭에 고정됩니다. 새 팝업은 해당 창에서 다시 연결하세요.</small>
<script src="popup.js"></script></body></html>
