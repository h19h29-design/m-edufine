name: Windows build, test and preview release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-main
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JavaScript and source manifests
        run: |
          foreach ($f in Get-ChildItem extension/*.js) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $f" }
          }
          python -c "import json, pathlib, xml.etree.ElementTree as E; r=pathlib.Path('.'); [json.loads(p.read_text(encoding='utf-8')) for p in [r/'extension/manifest.json',r/'native-host.json']]; [E.parse(p) for p in (r/'src').rglob('*') if p.suffix in ['.xaml','.csproj','.manifest']]"
          if ($LASTEXITCODE -ne 0) { throw 'Source manifest check failed' }
      - name: Chromium live-DOM regression tests (synthetic data only)
        run: |
          python -m pip install playwright==1.56.0
          if ($LASTEXITCODE -ne 0) { throw 'Test dependency install failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Test browser install failed' }
          python tests/test_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'DOM regression tests failed' }
      - name: Build self-contained Windows app
        run: |
          dotnet publish src/MEdufine/MEdufine.csproj -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Copy-Item extension publish/extension -Recurse -Force
          Copy-Item tools publish/tools -Recurse -Force
          Copy-Item docs publish/docs -Recurse -Force
          Copy-Item native-host.json,extension-id.txt,README.md,LICENSE,SECURITY.md publish/ -Force
      - name: Windows protocol and rendering smoke tests
        run: |
          $exe = (Resolve-Path publish/M-Edufine.exe).Path
          foreach ($mode in @('--self-test','--smoke-test','--ui-demo --smoke-test')) {
            $p = Start-Process $exe -ArgumentList $mode -PassThru
            if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "Timed out: $mode" }
            if ($p.ExitCode -ne 0) { throw "Failed: $mode, exit $($p.ExitCode)" }
          }
          if (-not (Test-Path artifacts/windows-ui.png)) { throw 'WPF render evidence missing' }
          if (-not (Test-Path artifacts/windows-ui-demo.png)) { throw 'Mdir demo render evidence missing' }
      - name: Build Windows installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          & $iscc /DAppVersion=0.3.0 installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install, validate registration, and uninstall in isolated runner
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'M-Edufine-InstallTest'
          $setup = (Resolve-Path artifacts/M-Edufine-Setup-0.3.0-win-x64.exe).Path
          $p = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR=`"$target`"" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Silent install failed' }
          if (-not (Test-Path "$target/M-Edufine.exe")) { throw 'Installed exe missing' }
          if (-not (Test-Path "$target/extension/manifest.json")) { throw 'Installed extension missing' }
          $key = 'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.medufine.bridge'
          if ((Get-Item $key).GetValue('') -ne "$target\native-host.json") { throw 'Native host registration mismatch' }
          $p = Start-Process "$target/M-Edufine.exe" -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Installed application self-test failed' }
          $p = Start-Process "$target/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Test-Path $key) { throw 'Native host registry key not removed' }
          'PASS: per-user install, native host registration, installed self-tests, uninstall. No institutional login was performed.' | Set-Content artifacts/installer-test.txt -Encoding utf8
      - name: Package release evidence and portable app
        run: |
          Compress-Archive -Path publish/* -DestinationPath artifacts/M-Edufine-0.3.0-win-x64.zip -Force
          Compress-Archive -Path extension/* -DestinationPath artifacts/M-Edufine-Extension-0.3.0.zip -Force
          Compress-Archive -Path artifacts/*tests.json,artifacts/self-test.json,artifacts/*test*.txt,artifacts/windows-ui.png,artifacts/windows-ui-demo.png -DestinationPath artifacts/M-Edufine-QA-0.3.0.zip -Force
          Get-ChildItem artifacts/*.exe,artifacts/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.3.0'
          $sha=git rev-parse HEAD
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $sha --prerelease --title 'M-Edufine 0.3.0 Preview - Windows keyboard client' --notes 'Windows x64 installer, portable app, Edge/Chrome extension and QA evidence. Actual authenticated K-Edufine compatibility remains UNVERIFIED. Follow README for first-time extension loading. No business database, credential copying or cloud AI. F5 reads current DOM; it does not requery the server. DOM click dispatch does not prove server persistence.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = @(Get-ChildItem artifacts/*.exe,artifacts/M-Edufine-*.zip,artifacts/SHA256SUMS.txt | ForEach-Object { $_.FullName })          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M-Edufine-Windows-evidence
          path: |
            artifacts/
            smoke-error.txt
          if-no-files-found: warn
          retention-days: 14
